name: Actualité (publication automatique)

# Le mercredi des semaines paires, prépare UN article d'actualité sourcé et le PUBLIE tout seul s'il passe
# tous les contrôles : sources trouvées par la recherche web, chiffres vérifiés, extraits cités retrouvés
# mot pour mot dans les pages sources, relecture factuelle par une seconde passe d'IA.
# Publication directe ; l'e-mail est marqué « ⚠️ à relire » si une réserve subsiste. Rien de notable : aucun article.

on:
  schedule:
    - cron: "0 6 * * 3"       # mercredi 6 h UTC — seules les semaines paires sont traitées
  workflow_dispatch:
    inputs:
      sujet:
        description: "Thème imposé (facultatif), ex. : ouverture des stations"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  actu:
    runs-on: ubuntu-latest
    steps:
      - name: Semaine concernée ?
        id: sem
        run: |
          SEM=$((10#$(date +%V)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((SEM % 2)) -eq 0 ]; then
            echo "go=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Pas la bonne semaine pour ce contenu."
            echo "go=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.sem.outputs.go == 'oui'

      - uses: actions/setup-python@v5
        if: steps.sem.outputs.go == 'oui'
        with:
          python-version: "3.11"

      - name: Installer le client Anthropic
        if: steps.sem.outputs.go == 'oui'
        run: pip install anthropic

      - name: Préparer l'actualité
        if: steps.sem.outputs.go == 'oui'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUJET: ${{ github.event.inputs.sujet }}
        run: |
          python3 _scripts/generate_actu_hebdo.py --sujet "$SUJET" --review-out /tmp/actu_review.md

      - name: Publier automatiquement
        if: steps.sem.outputs.go == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          REVIEW=/tmp/actu_review.md
          TITRE=$(python3 -c "import json;d=json.load(open('actus_hebdo.json'))[-1];print(d['title'])")
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"

          # Publication automatique (plus de validation manuelle). Tous les contrôles sont passés : publication automatique.
          git add articles actus_hebdo.json contenus.json
          git commit -m "📰 Actualité : $TITRE"
          git pull --rebase origin main
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)

          # Compte rendu (sources, faits contrôlés) dans une « issue » : tu reçois un e-mail GitHub.
          {
            echo "Publié automatiquement après tous les contrôles (chiffres, sources, relecture)."
            echo "Pour le retirer : demande à Claude de le dépublier, en donnant ce commit : \`$SHA\`."
            echo
            sed -e '/^\*\*Merge = publication/d' \
                -e 's/À faire avant de fusionner (2 minutes)/Vérification a posteriori (recommandée)/' \
                -e 's/fermez la pull request sans la fusionner/demandez son retrait/' "$REVIEW"
          } > /tmp/issue.md
          if grep -qE "🔴 Réserves|⚠️ extrait introuvable|Points d'attention|Contrôles en échec" "$REVIEW"; then PREF="⚠️ Publié avec réserves (à relire)"; else PREF="✅ Publié"; fi
          gh issue create --title "$PREF : $TITRE" --body-file /tmp/issue.md || true

          # Un push fait avec le jeton du workflow ne relance pas les autres workflows : on les lance ici.
          gh workflow run "Mettre à jour les contenus (accueil + actus)" || true
