name: Portrait de station (brouillon à valider)

# Le vendredi, prépare UN portrait de station complet et sourcé, et ouvre une pull request.
# La station est choisie automatiquement (France d'abord, les mieux notées d'abord, jamais déjà publiée).
# Rien n'est publié tant que vous n'avez pas fusionné ("Merge") la pull request.
#
# Réglages : les mêmes que pour « Actualité » (secret ANTHROPIC_API_KEY, recherche web activée,
# permissions des Actions) — déjà faits.

on:
  schedule:
    - cron: "0 6 * * 5"       # vendredi 6 h UTC
  workflow_dispatch:
    inputs:
      sujet:
        description: "Station imposée (facultatif), nom exact, ex. : Les Gets. Vide = choix automatique"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le client Anthropic
        run: pip install anthropic

      - name: Préparer le portrait
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUJET: ${{ github.event.inputs.sujet }}
        run: |
          if [ -n "$SUJET" ]; then
            python3 _scripts/generate_portrait_hebdo.py --sujet "$SUJET" --review-out /tmp/portrait_review.md
          else
            python3 _scripts/generate_portrait_hebdo.py --review-out /tmp/portrait_review.md
          fi

      - name: Ouvrir la pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement (pas de portrait fiable cette fois)."
            exit 0
          fi
          TITRE=$(python3 -c "import json;d=json.load(open('portraits_hebdo.json'))[-1];print(d['title'])")
          BRANCHE="portrait/$(date +%Y-%m-%d-%H%M)"
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"
          git checkout -b "$BRANCHE"
          git add articles portraits_hebdo.json contenus.json
          git commit -m "🏔️ Portrait : $TITRE"
          git push origin "$BRANCHE"
          gh pr create --base main --head "$BRANCHE" \
            --title "Portrait : $TITRE" \
            --body-file /tmp/portrait_review.md
