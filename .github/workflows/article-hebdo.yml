name: Classement (publication automatique)

# Le lundi des semaines paires, prépare UN article « classement chiffré » et le PUBLIE tout seul.
# Aucune IA : les chiffres viennent de stations-data.js, donc rien à payer et rien d'inventé.
# (Les semaines impaires, le lundi est réservé au guide saisonnier.)
# Si un contrôle échoue, le script s'arrête : rien n'est publié.

on:
  schedule:
    - cron: "0 6 * * 1"       # lundi 6 h UTC — seules les semaines paires sont traitées
  workflow_dispatch:
    inputs:
      sujet:
        description: 'Sujet imposé (facultatif), ex. : prix:savoie (voir la liste en lançant le script avec --list)'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - name: Semaine concernée ?
        id: sem
        run: |
          SEM=$((10#$(date +%V)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((SEM % 2)) -eq 0 ]; then
            echo "go=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Pas la bonne semaine pour ce contenu."
            echo "go=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.sem.outputs.go == 'oui'

      - uses: actions/setup-python@v5
        if: steps.sem.outputs.go == 'oui'
        with:
          python-version: "3.11"

      - name: Préparer l'article
        if: steps.sem.outputs.go == 'oui'
        env:
          SUJET: ${{ github.event.inputs.sujet }}
        run: |
          if [ -n "$SUJET" ]; then
            python3 _scripts/generate_article_hebdo.py --key "$SUJET" --review-out /tmp/article_review.md
          else
            python3 _scripts/generate_article_hebdo.py --review-out /tmp/article_review.md
          fi

      - name: Publier automatiquement
        if: steps.sem.outputs.go == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          REVIEW=/tmp/article_review.md
          TITRE=$(python3 -c "import json;d=json.load(open('articles_hebdo.json'))[-1];print(d['title'])")
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"

          # Publication automatique (plus de validation manuelle). Tous les contrôles sont passés : publication automatique.
          git add articles articles_hebdo.json contenus.json
          git commit -m "📰 Article de la semaine : $TITRE"
          git pull --rebase origin main
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)

          # Compte rendu (sources, faits contrôlés) dans une « issue » : tu reçois un e-mail GitHub.
          {
            echo "Publié automatiquement après tous les contrôles (chiffres, sources, relecture)."
            echo "Pour le retirer : demande à Claude de le dépublier, en donnant ce commit : \`$SHA\`."
            echo
            sed -e '/^\*\*Merge = publication/d' \
                -e 's/À faire avant de fusionner (2 minutes)/Vérification a posteriori (recommandée)/' \
                -e 's/fermez la pull request sans la fusionner/demandez son retrait/' "$REVIEW"
          } > /tmp/issue.md
          if grep -qE "🔴 Réserves|⚠️ extrait introuvable|Points d'attention|Contrôles en échec" "$REVIEW"; then PREF="⚠️ Publié avec réserves (à relire)"; else PREF="✅ Publié"; fi
          gh issue create --title "$PREF : $TITRE" --body-file /tmp/issue.md || true

          # Un push fait avec le jeton du workflow ne relance pas les autres workflows : on les lance ici.
          gh workflow run "Mettre à jour les contenus (accueil + actus)" || true
