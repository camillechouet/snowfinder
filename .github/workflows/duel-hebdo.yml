name: Duel de la semaine (publication automatique)

# Chaque lundi, prépare UN duel de stations, le contrôle, puis le PUBLIE tout seul.
# Contrôles avant publication : structure, chiffres retrouvés dans les fiches, relecture factuelle
# par une seconde passe d'IA (jusqu'à 3 essais). Publication directe, sans validation manuelle ;
# si la relecture garde une réserve, l'e-mail est marqué « ⚠️ à relire ».
# Après publication : une « issue » GitHub (e-mail) donne le compte rendu et le commit à annuler.

on:
  schedule:
    - cron: "0 6 * * 1"       # lundi 6 h UTC (7 h ou 8 h en France)
  workflow_dispatch:
    inputs:
      pair:
        description: 'Paire imposée (facultatif), ex. : Chamonix|Megève'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  duel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le client Anthropic
        run: pip install anthropic

      - name: Préparer le duel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAIR: ${{ github.event.inputs.pair }}
        run: |
          if [ -n "$PAIR" ]; then
            python3 _scripts/generate_duel_hebdo.py --pair "$PAIR" --review-out /tmp/duel_review.md
          else
            python3 _scripts/generate_duel_hebdo.py --review-out /tmp/duel_review.md
          fi

      - name: Publier automatiquement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          REVIEW=/tmp/duel_review.md
          TITRE=$(python3 -c "import json;d=json.load(open('duels_hebdo.json'))[-1];print(d['a']+' vs '+d['b'])")
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"

          # Publication automatique (plus de validation manuelle). Tous les contrôles sont passés : publication automatique.
          git add duels_hebdo.json contenus.json
          git commit -m "📝 Duel de la semaine : $TITRE"
          git pull --rebase origin main
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)

          # Compte rendu (sources, faits contrôlés) dans une « issue » : tu reçois un e-mail GitHub.
          {
            echo "Publié automatiquement après tous les contrôles (chiffres, sources, relecture)."
            echo "Pour le retirer : demande à Claude de le dépublier, en donnant ce commit : \`$SHA\`."
            echo
            sed -e '/^\*\*Merge = publication/d' \
                -e 's/À faire avant de fusionner (2 minutes)/Vérification a posteriori (recommandée)/' \
                -e 's/fermez la pull request sans la fusionner/demandez son retrait/' "$REVIEW"
          } > /tmp/issue.md
          if grep -qE "🔴 Réserves|⚠️ extrait introuvable|Points d'attention|Contrôles en échec" "$REVIEW"; then PREF="⚠️ Publié avec réserves (à relire)"; else PREF="✅ Publié"; fi
          gh issue create --title "$PREF : $TITRE" --body-file /tmp/issue.md || true

          # Un push fait avec le jeton du workflow ne relance pas les autres workflows : on les lance ici.
          gh workflow run "Générer les comparatifs" || true
          sleep 60
          gh workflow run "Mettre à jour les contenus (accueil + actus)" || true
