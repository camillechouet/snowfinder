name: Relevés de neige

# Lit les bulletins d'enneigement officiels (haut / bas du domaine) des 25 stations françaises
# les plus hautes (19 domaines) et met à jour neige.json, affiché dans le bandeau « Enneigement »
# de la page d'accueil. Aucune valeur estimée : pas de bulletin récent = pas d'affichage.
#
# Se lance :
#  - tout seul, deux fois par jour (les stations publient leur bulletin le matin) ;
#  - à la main : bouton "Run workflow" (case « dry_run » = affiche sans écrire).
#
# Coût : 0 € (lecture directe). Seul le repli Claude Haiku, utilisé si la mise en page d'une
# page change, coûte quelques centimes par mois. La sortie du workflow (« Summary ») liste
# chaque domaine : ✓ lu, ou – ignoré avec la raison.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher seulement (n'écrit pas neige.json)"
        type: boolean
        required: false
        default: false
      no_llm:
        description: "Sans repli Claude Haiku"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "23 7,13 * * *"     # 8 h 23 et 14 h 23 en hiver (heure de Paris)

permissions:
  contents: write

concurrency:
  group: snowfinder-neige
  cancel-in-progress: false

jobs:
  neige:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer l'analyseur HTML
        run: pip install beautifulsoup4

      - name: Lire les bulletins
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
          NOLLM: ${{ github.event.inputs.no_llm }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$NOLLM" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python3 _scripts/generate_neige.py $ARGS

      - name: Commit si changement
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"
          git add neige.json
          if git diff --cached --quiet; then
            echo "✓ Rien à mettre à jour"
          else
            git commit -m "❄️ Relevés de neige"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              echo "Push refusé (tentative $i), nouvel essai dans 15 s…"; sleep 15
            done
            echo "Échec du push après 4 essais"; exit 1
          fi
