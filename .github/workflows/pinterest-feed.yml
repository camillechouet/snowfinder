name: Flux Pinterest (épingles quotidiennes)

# Chaque jour, prépare 3 images d'épingles (stations) et met à jour pinterest-feed.xml.
# Pinterest lit ce flux et publie les nouvelles épingles tout seul.

on:
  schedule:
    - cron: "30 5 * * *"      # tous les jours, 5 h 30 UTC (6 h 30 ou 7 h 30 en France)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Pillow et le client Anthropic
        run: pip install pillow anthropic

      - name: Générer accroches + images + flux
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 _scripts/generate_pinterest_feed.py

      - name: Publier
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "SnowFinder Bot"
          git config user.email "bot@snowfinder.fr"
          git add pinterest-feed.xml pinterest-hooks.json pinterest-state.json img/pins
          git commit -m "📌 Flux Pinterest du jour"
          git pull --rebase origin main
          git push origin HEAD:main
