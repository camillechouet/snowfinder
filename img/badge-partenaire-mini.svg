<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sf-gold-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C777"/>
      <stop offset="100%" stop-color="#B4872F"/>
    </linearGradient>
    <linearGradient id="sf-sky-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123A5A"/>
      <stop offset="100%" stop-color="#1C6FA5"/>
    </linearGradient>
    <filter id="sf-shadow-m" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0B2942" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sf-circle-clip-m"><circle cx="32" cy="32" r="24.5"/></clipPath>
    <linearGradient id="sf-pill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0D78C"/><stop offset="100%" stop-color="#C9982F"/></linearGradient>
  <filter id="sf-shadow-p" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0B2942" flood-opacity="0.35"/></filter>
  </defs>

  <g filter="url(#sf-shadow-m)">
    <circle cx="32" cy="32" r="30" fill="url(#sf-gold-m)"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g clip-path="url(#sf-circle-clip-m)"><image x="7.5" y="7.5" width="49" height="49" preserveAspectRatio="xMidYMid slice" opacity="0.92" href="data:image/jpeg;base64,"/></g>
    <circle cx="32" cy="32" r="24.5" fill="#0B2942" opacity="0.32"/>
    <circle cx="32" cy="32" r="24.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
    <g transform="rotate(-14 32 32)">
      <text x="32.8" y="43.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="900" fill="#000000" opacity="0.45">SF</text>
      <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="900" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linejoin="round">SF</text>
      <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="900" fill="#FFD55A" stroke="#0B2942" stroke-width="1.9" paint-order="stroke" stroke-linejoin="round">SF</text>
